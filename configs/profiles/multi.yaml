# 4-GPU node: GPU 0 runs `trl vllm-serve` (scripts/vllm_server.sh), GPUs 1-3 train with ZeRO-3.
# Full fine-tune of a 7B model. Launch training with configs/accelerate/multi_zero3.yaml.
hardware:
  profile: multi
  num_processes: 3
  min_vram_gb: 75
  min_free_disk_gb: 200

run:
  name: gsm8k-qwen2.5-7b-grpo-fullft

model:
  name_or_path: Qwen/Qwen2.5-7B-Instruct

adapter:
  mode: none

grpo:
  learning_rate: 1.0e-6            # full fine-tune: an order of magnitude below LoRA
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 2   # 4 x 2 x 3 GPUs = 24 completions = 3 prompts x 8

vllm:
  mode: server
  server_host: 127.0.0.1
  server_port: 8000
